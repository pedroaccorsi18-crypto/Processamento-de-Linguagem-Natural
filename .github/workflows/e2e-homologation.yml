name: Synapse E2E Homologation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: homologation
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: ${{ vars.SYNAPSE_E2E_BASE_URL }}
      E2E_API_URL: ${{ vars.SYNAPSE_E2E_API_URL }}
      E2E_SUPABASE_URL: ${{ vars.SYNAPSE_E2E_SUPABASE_URL }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SYNAPSE_E2E_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_QA_EMAIL_DOMAIN: synapse-e2e.invalid
      ALLOW_EXTERNAL_E2E: "true"
      E2E_RUN_COPILOT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Publicar evidências de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-e2e-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
